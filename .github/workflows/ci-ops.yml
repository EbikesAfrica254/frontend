name: CI Ops

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - apps/ops/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/ci-ops.yml
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - apps/ops/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/ci-ops.yml

permissions:
  contents: read

concurrency:
  group: ci-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ops lint

      - name: Type check
        run: pnpm --filter ops exec tsc --noEmit

      - name: Set up Python for Semgrep
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config auto --error

  publish-dev:
    name: publish-dev
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment:
      name: dev

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_REPOSITORY: ebikes/ops
      APP_NAME: ops

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Derive image coordinates
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:12}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build and push dev image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:dev
            ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.image.outputs.sha_tag }}
          build-args: |
            APP_NAME=${{ env.APP_NAME }}
            VERSION=dev
            BUILD_DATE=${{ steps.image.outputs.build_date }}
            VCS_REF=${{ steps.image.outputs.full_sha }}
          labels: |
            org.opencontainers.image.title=eBikes Africa ops frontend
            org.opencontainers.image.version=dev
            org.opencontainers.image.created=${{ steps.image.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.image.outputs.full_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=dev
          cache-from: type=registry,ref=${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:buildcache-dev
          cache-to: type=registry,ref=${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:buildcache-dev,mode=max

      - name: Trigger ops deployment via SSM
        id: deploy
        shell: bash
        env:
          DEPLOYMENT_REFERENCE: ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          set -Eeuo pipefail

          test -n "${INSTANCE_ID}"
          test -n "${DEPLOYMENT_REFERENCE}"

          COMMAND_ID="$(
            aws ssm send-command \
              --region "${{ vars.AWS_REGION }}" \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ops sha-${SHORT_SHA}" \
              --parameters commands="/usr/local/bin/ebikes-deploy-frontend deploy ops ${DEPLOYMENT_REFERENCE}" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"

          STATUS="$(
            aws ssm get-command-invocation \
              --region "${{ vars.AWS_REGION }}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text
          )"

          echo "SSM command status: ${STATUS}"
          test "${STATUS}" = "Success"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Dev Publish Summary — ops"
            echo
            echo "- Branch: dev"
            echo "- Commit: \`${{ steps.image.outputs.full_sha }}\`"
            echo "- Mutable tag: \`${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:dev\`"
            echo "- Immutable tag: \`${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.image.outputs.sha_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Deployment reference: \`${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}\`"
            echo "- SSM command id: \`${{ steps.deploy.outputs.command_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-staging:
    name: publish-staging
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment:
      name: staging

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_REPOSITORY: ebikes/ops
      APP_NAME: ops

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Derive image coordinates
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail

          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:12}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:staging
          build-args: |
            APP_NAME=${{ env.APP_NAME }}
            VERSION=staging
            BUILD_DATE=${{ steps.image.outputs.build_date }}
            VCS_REF=${{ steps.image.outputs.full_sha }}
          labels: |
            org.opencontainers.image.title=eBikes Africa ops frontend
            org.opencontainers.image.version=staging
            org.opencontainers.image.created=${{ steps.image.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.image.outputs.full_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.ref.name=staging
          cache-from: type=registry,ref=${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:buildcache-staging
          cache-to: type=registry,ref=${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:buildcache-staging,mode=max

      - name: Trigger ops deployment via SSM
        id: deploy
        shell: bash
        env:
          DEPLOYMENT_REFERENCE: ${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          set -Eeuo pipefail

          test -n "${INSTANCE_ID}"
          test -n "${DEPLOYMENT_REFERENCE}"

          COMMAND_ID="$(
            aws ssm send-command \
              --region "${{ vars.AWS_REGION }}" \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ops sha-${SHORT_SHA}" \
              --parameters commands="/usr/local/bin/ebikes-deploy-frontend deploy ops ${DEPLOYMENT_REFERENCE}" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --region "${{ vars.AWS_REGION }}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"

          STATUS="$(
            aws ssm get-command-invocation \
              --region "${{ vars.AWS_REGION }}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text
          )"

          echo "SSM command status: ${STATUS}"
          test "${STATUS}" = "Success"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging Publish Summary — ops"
            echo
            echo "- Branch: staging"
            echo "- Commit: \`${{ steps.image.outputs.full_sha }}\`"
            echo "- Mutable tag: \`${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:staging\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Deployment reference: \`${{ vars.ECR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}\`"
            echo "- SSM command id: \`${{ steps.deploy.outputs.command_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"